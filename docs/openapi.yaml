      description: >-
        Who may wake the server while it sleeps under autostartPolicy=allowlist. A
        player lands here by joining the server once; entries whose wake right was
        taken away stay listed with can_wake false, so it can be given back. Felis
        keeps this list itself, so it answers whether the server is running or not.
        A change of owner (claim, reaper release, account deletion) empties it.
      x-felis-face: [external]
      x-felis-tier: app
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The allowlist.
          content:
            application/json:
              schema:
                type: object
                required: [server, entries]
                properties:
                  server: { type: string }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AllowlistEntry' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

