<title>Felis</title>
<!-- Pixel art on a 10px grid. The cat blinks every few seconds unless the viewer asks for reduced motion. -->
<style>
.shut{opacity:0}
@media (prefers-reduced-motion:no-preference){
.open{animation:open 6s steps(1,end) infinite}
.shut{animation:shut 6s steps(1,end) infinite}
}
@keyframes open{0%{opacity:1}93%{opacity:0}96%{opacity:1}100%{opacity:1}}
@keyframes shut{0%{opacity:0}93%{opacity:1}96%{opacity:0}100%{opacity:0}}
</style>
