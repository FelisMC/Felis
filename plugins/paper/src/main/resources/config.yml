# felis-paper — the lobby UI face (spec §12).
#
# This plugin is a PURE UI face: it speaks only the felis:control plugin-message
# channel to the Velocity proxy. It holds no felis-api token and never contacts
# felis-api directly.
#
# Player-facing settings are edited in the panel at /admin/lobby and stored in
# /data/felis-experience.json. This file does not hold those settings.
#
# /menu asks the proxy which servers to show
# (a ListRequest over felis:control) and the proxy answers from the same registry
# it routes by, so a server created in the panel appears here on its own. Tiles are
# paged 45 at a time. Status, ownership and autostart stay with the proxy and
# felis-api: every tile is filled in by a live StatusQuery when the menu opens, and
# acting on a tile sends a Wake or Claim frame that the proxy authorizes against the
# player's verified identity.
#
# Older versions read a static `servers:` list from this file. It is ignored now.
