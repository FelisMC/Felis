plugins {
    id 'java'
}

group = 'best.lolicon.felis'
version = '0.1.0'

// Paper 26.x needs Java 25 (paper-api declares org.gradle.jvm.version = 25), so this module requires a Java 25 toolchain.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // Pinned to the API of the server in deploy/game-stack.lock PAPER_JAR_URL (<mc>.build.<build>-<channel>), never a
    // -SNAPSHOT; deploy/bootstrap_test.sh fails when this and the lock drift apart.
    compileOnly 'io.papermc.paper:paper-api:26.3.build.40-alpha'
}

// Compile only lobby, codec, and experience classes; exclude API clients and credential configuration.
sourceSets {
    main {
        java {
            srcDir '../shared/src/main/java'
            include 'best/lolicon/felis/paper/**'
            include 'best/lolicon/felis/link/Control.java'
            include 'best/lolicon/felis/link/ControlFrame.java'
            include 'best/lolicon/felis/link/Json.java'
            include 'best/lolicon/felis/link/ExperienceConfig.java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Self-test mains (not part of `build`); plugins/test.sh runs `./gradlew lobbyTest`, which runs all three.
sourceSets {
    lobbyTest {
        java {
            srcDir 'test'
            include 'best/lolicon/felis/paper/Fakes.java'
            include 'best/lolicon/felis/paper/LobbyGuardTest.java'
            include 'best/lolicon/felis/paper/MenuTilesTest.java'
            include 'best/lolicon/felis/paper/LobbyMenuTest.java'
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('menuTilesTest', JavaExec) {
    group = 'verification'
    description = 'Runs the MenuTilesTest self-test main.'
    classpath = sourceSets.lobbyTest.runtimeClasspath
    mainClass = 'best.lolicon.felis.paper.MenuTilesTest'
}

tasks.register('lobbyMenuTest', JavaExec) {
    group = 'verification'
    description = 'Runs the LobbyMenuTest self-test main.'
    classpath = sourceSets.lobbyTest.runtimeClasspath
    mainClass = 'best.lolicon.felis.paper.LobbyMenuTest'
}

tasks.register('lobbyTest', JavaExec) {
    group = 'verification'
    description = 'Runs the LobbyGuardTest, MenuTilesTest and LobbyMenuTest self-test mains.'
    dependsOn 'menuTilesTest', 'lobbyMenuTest'
    classpath = sourceSets.lobbyTest.runtimeClasspath
    mainClass = 'best.lolicon.felis.paper.LobbyGuardTest'
}
