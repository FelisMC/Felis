plugins {
    id 'java'
}

group = 'best.lolicon.felis'
version = '0.1.0'

// Emits Java 17 bytecode (options.release below); building needs a JDK >= 21 to read Limbo's class-file major 65.

repositories {
    mavenCentral()
    maven {
        name = 'loohp'
        url = 'https://repo.loohpjames.com/repository'
    }
}

// The shared link core is a source include, so it compiles into this jar with nothing to shade.
sourceSets {
    main {
        java {
            srcDir '../shared/src/main/java'
        }
    }
}

// Require the locked Limbo API version; lock changes also require regenerated dependency verification metadata.
def limboVersion = project.findProperty('limboVersion')
if (!limboVersion) {
    throw new GradleException('pass -PlimboVersion=<LIMBO_VERSION from deploy/game-stack.lock>')
}

dependencies {
    // Limbo provides its own API at runtime.
    compileOnly "com.loohp:Limbo:${limboVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Framework-free self-test main, run by plugins/test.sh via `./gradlew loginTest`.
sourceSets {
    loginTest {
        java {
            srcDir 'test'
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('loginTest', JavaExec) {
    group = 'verification'
    description = 'Runs the LoginFlowTest self-test main.'
    classpath = sourceSets.loginTest.runtimeClasspath
    mainClass = 'best.lolicon.felis.limbo.LoginFlowTest'
}
