plugins {
    id 'java'
}

group = 'best.lolicon.felis'
version = '0.1.0'

// Compile against a released Velocity API supporting the installed stack, without bundling it.
def velocityApi = findProperty('velocityApi') ?: '3.5.1'

// Keep deployed bytecode at Java 21; the JDK 25 snapshot compatibility check is separate from release verification.
def javaTarget = JavaVersion.toVersion(findProperty('javaTarget') ?: '21')

java {
    sourceCompatibility = javaTarget
    targetCompatibility = javaTarget
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // velocity-api is compile-only (the proxy provides it at runtime); the
    // annotation processor turns @Plugin into the generated velocity-plugin.json.
    compileOnly "com.velocitypowered:velocity-api:${velocityApi}"
    annotationProcessor "com.velocitypowered:velocity-api:${velocityApi}"
}

// Compile the dependency-free shared core into each loader JAR without shading.
sourceSets {
    main {
        java {
            srcDir '../shared/src/main/java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Kept out of build on purpose: bootstrap runs gradle clean build on every install, and a test there would only slow it. plugins/test.sh runs ./gradlew routingTest.
sourceSets {
    routingTest {
        java {
            srcDir 'test'
            include 'best/lolicon/felis/velocity/Fakes.java'
            include 'best/lolicon/felis/velocity/ServerRegistryTest.java'
            include 'best/lolicon/felis/velocity/WaitingRouterTest.java'
            include 'best/lolicon/felis/velocity/ControlChannelTest.java'
            include 'best/lolicon/felis/velocity/ServerCommandTest.java'
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

def routingMains = ['ServerRegistryTest', 'WaitingRouterTest', 'ControlChannelTest', 'ServerCommandTest']
routingMains.each { name ->
    tasks.register(name, JavaExec) {
        group = 'verification'
        description = "Runs the ${name} self-test main."
        classpath = sourceSets.routingTest.runtimeClasspath
        mainClass = "best.lolicon.felis.velocity.${name}"
    }
}

tasks.register('routingTest') {
    group = 'verification'
    description = 'Runs the routing self-tests (ServerRegistry, WaitingRouter, ControlChannel, ServerCommand).'
    dependsOn routingMains
}

// Produce deterministic JARs so unchanged rebuilds do not restart the proxy and disconnect players.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
