plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'java'
}

group = 'best.lolicon.felis'
version = '0.1.0'

// NeoForge 20.4 (MC 1.20.4) is a Java 17 line; toolchain 17 resolves to the running JDK 17.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation 'net.neoforged:neoforge:20.4.251'
}

// The shared link core is compiled in; no reobf step, the jar from `build` is the deliverable.
sourceSets {
    main {
        java {
            srcDir '../shared/src/main/java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
