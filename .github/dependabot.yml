# Keep version comments beside pinned action SHAs and tags beside image digests so Dependabot can update both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/limbo
      - /deploy/lobby
      - /deploy/paper
    schedule:
      interval: weekly
    # A new major is a runtime change (Paper 26.x needs Java 25, Limbo's jar is Java 21
    # bytecode), so only digests and minors are proposed; majors move by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
