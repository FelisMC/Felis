# deploy/bootstrap.sh end to end on a fresh Ubuntu 24.04 x86_64 runner: the paths every
# host goes through, run for real instead of by hand on a VM.
#
#   artifacts  this commit's release assets, built by deploy/build-release-artifacts.sh the
#              way release.yml builds a tag's (amd64 only, the runners' architecture)
#   install    a full install from those assets, the way a release installs, on a host with
#              ufw enabled, then the same assets again (a rerun must converge without
#              restarting what did not change, importing or uploading an image again, or
#              touching Docker)
#   readme     the README's one-line install as a new host runs it today: this commit's
#              installer on its default channel, which installs the newest published
#              release's binary, images and plugin from that release's assets; skipped until
#              a release exists
#   upgrade    the newest published release through its own installer and its own assets,
#              rows of every kind seeded into its database, then this commit's assets on
#              top of it; skipped until a release exists
#   source     a full install built on the host from this checkout (FELIS_SKIP_FETCH):
#              the fallback a release without assets, or an unsupported one, takes. It builds
#              everything with Docker, so it runs by hand and weekly only
#
# This runs on pushes that touch what gets installed, by hand, and weekly (a moving
# upstream: apt mirrors, k3s's install script and release assets, Adoptium).
# deploy/e2e_check.sh holds the assertions, deploy/e2e_seed.sh the upgrade's seed and its check.
name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'cmd/**'
      - 'internal/**'
      - 'panel/**'
      - 'plugins/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# An explicit bash runs with -o pipefail, so `bootstrap.sh | tee install.log` fails the step
# when the installer fails; the default shell reports tee's status.
defaults:
  run:
    shell: bash

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the newest tag is the version's base, as on the dev channel

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Stamped the way bootstrap stamps a build of main: "<newest tag>+g<sha>".
      - name: Build the release assets
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
          FELIS_RELEASE_ARCHES=amd64 deploy/build-release-artifacts.sh "${base}+g$(git rev-parse --short HEAD)" dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  install:
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The images, k3s and the JRE need more room than a stock runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-assets
          path: dist

      # The runner has Docker preinstalled, so its absence proves nothing: the log shows
      # whether bootstrap reached for it. From FELIS_ARTIFACT_DIR every image and the plugin
      # come out of the assets, so it must not have. (`! grep` is spelled `if grep ... exit 1`
      # below because bash -e ignores a failing `!` command.)
      # ufw, enabled on many Ubuntu hosts, drops every inbound packet no rule admits, the
      # pods' traffic to the API server among them; the runner ships it disabled. The
      # runner's own traffic is outbound, which ufw lets through.
      - name: Enable ufw
        run: sudo ufw --force enable

      - name: Install
        run: sudo FELIS_ARTIFACT_DIR="$GITHUB_WORKSPACE/dist" FELIS_INSTALL_MODE=full bash deploy/bootstrap.sh 2>&1 | tee install.log

      - name: Check the install
        run: |
          sudo bash deploy/e2e_check.sh install
          for tag in felis-k3s-pods felis-k3s-services felis-panel felis-proxy; do
            sudo ufw status | grep -qE "# ${tag} *$"
          done
          if grep -E 'docker already installed|installing docker|docker running' install.log; then exit 1; fi
          for role in felis limbo lobby paper; do
            grep -q "felis/${role}:[^ ]* is the release's" install.log
          done
          grep -q "docker.io/library/registry@sha256:[0-9a-f]* is the release's" install.log
          grep -q "docker.io/library/postgres@sha256:[0-9a-f]* is the release's" install.log
          grep -q "felis-velocity.jar is the release's" install.log

      - name: Rerun the same assets
        run: sudo FELIS_ARTIFACT_DIR="$GITHUB_WORKSPACE/dist" FELIS_INSTALL_MODE=full bash deploy/bootstrap.sh 2>&1 | tee rerun.log

      # containerd and the registry already hold every image under the digest the listing
      # names, so nothing is imported or uploaded twice.
      - name: Check the rerun
        run: |
          sudo bash deploy/e2e_check.sh rerun
          grep -q 'felis-velocity unchanged; left running' rerun.log
          if grep -E 'docker already installed|installing docker|docker running' rerun.log; then exit 1; fi
          if grep -E 'importing felis-image-|mirroring .* into the internal registry' rerun.log; then exit 1; fi
          grep -q 'is already in the internal registry' rerun.log

      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          k() { sudo -E /usr/local/bin/k3s kubectl "$@"; }
          k get pods -A -o wide || true
          k get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          for p in $(k get pods -A --no-headers 2>/dev/null | awk '$4 != "Running" && $4 != "Completed" {print $1 "/" $2}'); do
            k -n "${p%%/*}" describe pod "${p#*/}" | tail -n 40 || true
            k -n "${p%%/*}" logs "${p#*/}" --all-containers --tail=60 || true
          done
          k -n felis logs deploy/felis-postgres --tail=60 || true
          sudo journalctl -u k3s -u felis-velocity --no-pager -n 120 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-install-logs
          path: '*.log'
          if-no-files-found: ignore

  # The README's command on a fresh host: this commit's installer, as main serves it, on its
  # default channel with nothing pinned. It resolves the newest release and installs that
  # release's binary, images and plugin from its assets, each checked against its
  # SHA256SUMS; the private repo's token is the only thing added. FELIS_INSTALL_MODE picks the
  # mode the setup console would ask for.
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Find the newest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/e2e_release.sh find

      - name: Install as the README does
        if: steps.release.outputs.tag != ''
        env:
          TOKEN: ${{ github.token }}
        run: sudo FELIS_GITHUB_TOKEN="$TOKEN" FELIS_INSTALL_MODE=full bash deploy/bootstrap.sh 2>&1 | tee readme.log

      # The binary is the release's, so the phase is `release`: its database backup and
      # timers are the release's to have or lack.
      - name: Check the install
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BINARY: ${{ steps.release.outputs.binary }}
          SUMS: ${{ steps.release.outputs.sums }}
        run: |
          sudo bash deploy/e2e_check.sh release
          sudo /usr/local/bin/felis version | grep -qx "felis ${TAG}"
          bash deploy/e2e_release.sh check-readme readme.log

      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sudo -E /usr/local/bin/k3s kubectl get pods -A -o wide || true
          sudo -E /usr/local/bin/k3s kubectl -n felis logs deploy/felis-postgres --tail=60 || true
          sudo journalctl -u k3s -u felis-velocity -u docker --no-pager -n 120 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-readme-logs
          path: '*.log'
          if-no-files-found: ignore

  upgrade:
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-assets
          path: dist

      - name: Find the newest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/e2e_release.sh find

      # The release's own installer on its default channel, fetching the release's own
      # binary: what a host that installed that release is running today. FELIS_REF would
      # build the tag from source instead, a path no host takes by default. FELIS_RELEASE pins
      # the tag found above; an installer older than FELIS_RELEASE ignores it and resolves
      # the newest release, the same tag.
      - name: Install the newest release
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TOKEN: ${{ github.token }}
        run: |
          git show "${TAG}:deploy/bootstrap.sh" > release-bootstrap.sh
          sudo FELIS_GITHUB_TOKEN="$TOKEN" FELIS_RELEASE="$TAG" FELIS_INSTALL_MODE=full bash release-bootstrap.sh 2>&1 | tee release.log

      - name: Check the release install
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BINARY: ${{ steps.release.outputs.binary }}
        run: |
          sudo bash deploy/e2e_check.sh release
          bash deploy/e2e_release.sh check-own release.log

      # A fresh install's database holds only what its migrations wrote: the seed gives the
      # upgrade's move and its pending migrations existing rows to carry.
      - name: Seed the release's database
        if: steps.release.outputs.tag != ''
        run: sudo bash deploy/e2e_seed.sh seed

      - name: Upgrade to this commit
        if: steps.release.outputs.tag != ''
        run: sudo FELIS_ARTIFACT_DIR="$GITHUB_WORKSPACE/dist" FELIS_INSTALL_MODE=full bash deploy/bootstrap.sh 2>&1 | tee upgrade.log

      # Both checks run and report: the seeded rows go last, after the restore drill has
      # also put them back from a bundle.
      - name: Check the upgrade
        if: steps.release.outputs.tag != ''
        run: |
          rc=0
          sudo bash deploy/e2e_check.sh upgrade || rc=1
          sudo bash deploy/e2e_seed.sh check || rc=1
          exit "$rc"

      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sudo -E /usr/local/bin/k3s kubectl get pods -A -o wide || true
          sudo -E /usr/local/bin/k3s kubectl -n felis logs deploy/felis-postgres --tail=60 || true
          # The release ran the database on the host; the upgrade moves it into k3s.
          sudo journalctl -u k3s -u felis-velocity -u postgresql --no-pager -n 120 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-upgrade-logs
          path: '*.log'
          if-no-files-found: ignore

  source:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # FELIS_SKIP_FETCH builds whatever sits in /opt/felis/src; the .git directory is what
      # stamps the build. Root owns it so git, run as root by the installer, does not refuse
      # it as dubious.
      - name: Stage this commit as the installer's source
        run: |
          sudo mkdir -p /opt/felis
          sudo cp -a "$GITHUB_WORKSPACE" /opt/felis/src
          sudo chown -R root:root /opt/felis/src

      - name: Install
        run: sudo FELIS_SKIP_FETCH=1 FELIS_INSTALL_MODE=full bash /opt/felis/src/deploy/bootstrap.sh 2>&1 | tee source.log

      - name: Check the install
        run: sudo bash deploy/e2e_check.sh install

      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sudo -E /usr/local/bin/k3s kubectl get pods -A -o wide || true
          sudo journalctl -u k3s -u felis-velocity -u docker --no-pager -n 120 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-source-logs
          path: '*.log'
          if-no-files-found: ignore
