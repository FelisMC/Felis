# Build tagged release artifacts through Dockerfile so binaries embed the real panel rather than its source placeholder.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Reuse ci.yml gates before building or publishing release assets.
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Cross-build amd64/arm64 artifacts; target-runtime package installation requires QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Two architectures of five images plus BuildKit's cache outgrow the runner's free disk
      # with its preinstalled SDKs in place; none of them is used here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Check the native version stamp and cross-architecture ELF identity rather than relying on binfmt execution.
      - name: Build the release assets
        run: deploy/build-release-artifacts.sh "${GITHUB_REF_NAME}" dist

      # A CycloneDX SBOM per binary, listing the Go modules linked into it from the build info.
      # Write release metadata after checksums so bootstrap's asset list excludes it.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/felis-linux-amd64
          format: cyclonedx-json
          output-file: dist/felis-linux-amd64.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/felis-linux-arm64
          format: cyclonedx-json
          output-file: dist/felis-linux-arm64.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload
      id-token: write # the Sigstore certificate behind the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      # The artifact store sits between the two jobs, so check the handover too.
      - run: sha256sum -c SHA256SUMS

      # Publish verifiable workflow provenance where supported; private non-Enterprise repositories retain checksum verification.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            felis-linux-*
            felis-image-*.tar
            felis-velocity.jar

      # Verify pushed tags, mark prereleases explicitly, and reject replacing published assets with different bytes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every file the build handed over: SHA256SUMS names the installable ones, and the
          # SBOMs ride along.
          assets="$(ls)"
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # shellcheck disable=SC2086 # word-splitting the list is the point
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $flags $assets
            exit 0
          fi
          # The REST payload's per-asset "digest" is GitHub's own sha256 of the stored file.
          published="$(gh api "repos/${GH_REPO}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[] | "\(.name) \(.digest)"')"
          for a in $assets; do
            have="$(printf '%s\n' "$published" | awk -v n="$a" '$1 == n { print $2 }')"
            want="sha256:$(sha256sum < "$a" | cut -d' ' -f1)"
            if [ -z "$have" ]; then
              gh release upload "$GITHUB_REF_NAME" "$a"
            elif [ "$have" != "$want" ]; then
              echo "::error::$a is already published with $have; this run built $want. Published assets are never replaced."
              exit 1
            fi
          done
