# Run CI on pull requests and main, including panel tests omitted from the image build.
name: ci

# Release tags reuse these gates through workflow_call; workflow_dispatch supports manual reruns.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # -race: felis-api and the operator are mostly goroutines (watchers, the
      # registry pruner, the backup scheduler, the rate limiters).
      - run: go test -race ./...
      # Pinned by hand: Dependabot does not read go run. 2026.2.1 cannot read Go 1.27.2's export data; this master commit includes the change.
      # Return to a release tag once 2026.2.2 is published.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45 ./...

  # Check reachable vulnerabilities separately; standard-library fixes also require updating the Dockerfile toolchain.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Test real PostgreSQL contracts across supported majors using matching container-side client tools.
  pgint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['13', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: felis
          POSTGRES_PASSWORD: pgint
          POSTGRES_DB: felis_pgint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U felis -d felis_pgint"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go test -race -tags pgint -count=1 ./internal/pgint/
        env:
          FELIS_TEST_PG_URL: postgres://felis:pgint@localhost:5432/felis_pgint?sslmode=disable
          FELIS_TEST_PG_EXEC: docker exec -i ${{ job.services.postgres.id }}

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Parse each script with its shebang interpreter; the raw installer itself requires a fresh privileged host.
      - name: Check shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do
            case "$(head -1 "$f")" in
              *bash) bash -n "$f" || exit 1 ;;
              *) sh -n "$f" || exit 1 ;;
            esac
          done

      # A pinned release rather than the runner image's copy, so a runner update cannot
      # change what fails. Warnings and errors fail the job; style notes (info) do not.
      - name: shellcheck
        run: |
          curl -fsSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c
          tar -xJf shellcheck.tar.xz
          ./shellcheck-v0.11.0/shellcheck -S warning $(git ls-files '*.sh')

      # An exit status is 8 bits, so `exit "$fails"` reads 256 failures as a pass. The suites
      # exit 1 on any failure; this keeps the next one from carrying its count out.
      - name: No script exits with its failure count
        run: |
          if git grep -nE 'exit +"?\$\{?[a-z_]*fail[a-z_]*\}?"?[[:space:]]*$' -- '*.sh'; then exit 1; fi

      # Avoid early-closing grep/head pipelines under pipefail because producer SIGPIPE can cause false failures.
      - name: No reader that stops early after a pipe
        run: |
          if git grep -nE '\|[[:space:]]*(head([[:space:]]|$)|grep[[:space:]]+-[A-Za-z]*[qm])' -- '*.sh' '.github/workflows/*.yml' ':!*_test.sh' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "read the whole input instead: grep ... >/dev/null, sed -n 1p"
            exit 1
          fi

      - run: sh deploy/bootstrap_test.sh
      - run: sh deploy/uninstall_test.sh
      - run: bash deploy/e2e_release_test.sh
      - run: bash deploy/e2e_upstream_test.sh

  # Use promtool for alert behavior and Go tests for rule parity and metric-name contracts.
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A pinned release, like shellcheck's, so a new Prometheus cannot change what fails.
      - name: promtool
        run: |
          curl -fsSL -o prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz
          echo "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0  prometheus.tar.gz" | sha256sum -c
          tar -xzf prometheus.tar.gz --strip-components=1 prometheus-3.15.0.linux-amd64/promtool
          ./promtool check rules deploy/alerts/felis-alerts.yaml
          ./promtool test rules deploy/alerts/felis-alerts_test.yml

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Read Node's major from Dockerfile so CI and release builds use the same runtime.
      - name: Read the panel's Node version from the Dockerfile
        id: node
        run: |
          version="$(sed -n 's/^FROM.*node:\([0-9][0-9]*\)-.*/\1/p' Dockerfile | sed -n 1p)"
          [ -n "$version" ] || { echo "Dockerfile has no 'FROM ... node:<major>' line"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - run: npm ci
        working-directory: panel

      - run: npm test
        working-directory: panel

      # `tsc -b`: tsconfig.json is a solution file (files: [] plus references), so a plain
      # `tsc --noEmit` checked nothing and passed with type errors in the tree.
      - run: npm run typecheck
        working-directory: panel

      # Rules of hooks and effect dependency lists, with --max-warnings 0.
      - run: npm run lint
        working-directory: panel

      # openapi.gen.ts is generated from api/openapi.yaml and checked in, so the
      # compile-time parity in src/lib/types.parity.ts needs no generator in the build;
      # a schema edit that was not regenerated fails here.
      - name: openapi.gen.ts matches api/openapi.yaml
        working-directory: panel
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/openapi.gen.ts

      # Browser smoke over the mock-mode dev server, in the runner's installed Chrome
      # (playwright.config.ts sets channel: chrome, so nothing is downloaded).
      - run: npm run test:e2e
        working-directory: panel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: panel-playwright-report
          path: |
            panel/playwright-report
            panel/test-results
          retention-days: 7

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The other jobs never touch the Java layer. JDK 25 is what the plugin build image runs (paper-api 26.x needs it), and each module's wrapper brings the Gradle the image pins.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - run: bash plugins/test.sh

  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Keep loader Gradle wrappers executable because their documented commands invoke them directly.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - run: bash plugins/test-mods.sh
