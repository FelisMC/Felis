# Runs the checks on pull requests and on main.
#
# release.yml already runs `go vet` and `go test`, but only once a vX.Y.Z tag exists — by then
# a red change is on the release path and the only remedy is a new tag. This is the same gate
# moved to where it can still stop something, plus the panel suite, which nothing ran at all:
# the release goes through the Dockerfile, and the Dockerfile runs `npm run build`, never
# `npm test`.
#
# The push trigger is limited to main rather than every branch, for the reason release.yml is
# not repeated here: a branch with an open PR would otherwise run the whole suite twice per
# push, once for refs/heads/<branch> and once for refs/pull/N/merge. Those are different
# concurrency groups, so neither cancels the other, and this repository is private and billed
# for both. A branch with no PR open yet is the one case that loses coverage, and opening the
# PR is what asks for the answer.
name: ci

#
# release.yml calls this workflow (workflow_call) before it builds anything, so a tag passes
# exactly these gates and there is one list of them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # -race: felis-api and the operator are mostly goroutines (watchers, the
      # registry pruner, the backup scheduler, the rate limiters).
      - run: go test -race ./...
      # The version is pinned here and bumped by hand; Dependabot does not read `go run`.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

  # Separate from the go job so a newly published advisory reads as what it is. govulncheck
  # exits non-zero only for vulnerable code this module can actually reach, standard
  # library included: setup-go installs the newest patch of go.mod's Go line, so a finding
  # there means the Dockerfile's golang digest (which ships the release) needs a bump too.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The business stores' SQL against a real PostgreSQL (internal/pgint): the unit suites run
  # on fakes, and PGRepo drifted from them three times while those stayed green. 13 is the
  # oldest server a supported distribution installs (EL9), 18 the newest (Arch).
  pgint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['13', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: felis
          POSTGRES_PASSWORD: pgint
          POSTGRES_DB: felis_pgint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U felis -d felis_pgint"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - run: go test -race -tags pgint -count=1 ./internal/pgint/
        env:
          FELIS_TEST_PG_URL: postgres://felis:pgint@localhost:5432/felis_pgint?sslmode=disable

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # bootstrap.sh is the only thing that ever runs on a fresh host, and nothing here can
      # run it — it wants root, a package manager and k3s. Syntax plus the extracted-block
      # checks in bootstrap_test.sh is the coverage that is reachable without a machine.
      # Each file is parsed by the interpreter its own shebang names. A blanket `sh -n` is
      # wrong and not obviously so: on a developer machine `sh` is usually bash and passes
      # everything, while the runner's `sh` is dash and rejects bootstrap.sh at the first of
      # its arrays. Honouring the shebang is what makes local and CI agree.
      - name: Check shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do
            case "$(head -1 "$f")" in
              *bash) bash -n "$f" || exit 1 ;;
              *) sh -n "$f" || exit 1 ;;
            esac
          done

      # A pinned release rather than the runner image's copy, so a runner update cannot
      # change what fails. Warnings and errors fail the job; style notes (info) do not.
      - name: shellcheck
        run: |
          curl -fsSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c
          tar -xJf shellcheck.tar.xz
          ./shellcheck-v0.11.0/shellcheck -S warning $(git ls-files '*.sh')

      - run: sh deploy/bootstrap_test.sh
      - run: sh deploy/uninstall_test.sh

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Dockerfile's `FROM node:<major>` is the only place the panel's Node version is
      # declared — there is no .nvmrc and no engines field. Reading it here rather than
      # repeating the number keeps CI testing the version a release is actually built on;
      # a second copy would drift silently the first time the image is bumped.
      - name: Read the panel's Node version from the Dockerfile
        id: node
        run: |
          version="$(sed -n 's/^FROM.*node:\([0-9][0-9]*\)-.*/\1/p' Dockerfile | head -1)"
          [ -n "$version" ] || { echo "Dockerfile has no 'FROM ... node:<major>' line"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - run: npm ci
        working-directory: panel

      - run: npm test
        working-directory: panel

      # `tsc -b`: tsconfig.json is a solution file (files: [] plus references), so a plain
      # `tsc --noEmit` checked nothing and passed with type errors in the tree.
      - run: npm run typecheck
        working-directory: panel

      # Rules of hooks and effect dependency lists, with --max-warnings 0.
      - run: npm run lint
        working-directory: panel

      # openapi.gen.ts is generated from docs/openapi.yaml and checked in, so the
      # compile-time parity in src/lib/types.parity.ts needs no generator in the build;
      # a schema edit that was not regenerated fails here.
      - name: openapi.gen.ts matches docs/openapi.yaml
        working-directory: panel
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/openapi.gen.ts

      # Browser smoke over the mock-mode dev server, in the runner's installed Chrome
      # (playwright.config.ts sets channel: chrome, so nothing is downloaded).
      - run: npm run test:e2e
        working-directory: panel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: panel-playwright-report
          path: |
            panel/playwright-report
            panel/test-results
          retention-days: 7

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The other jobs never touch the Java layer: the plugin jars were only ever
      # compiled by bootstrap on a live host, and the test mains under plugins/*/test
      # were run by hand. JDK 25 is what the plugin build image runs (paper-api 26.x
      # needs it); each module's wrapper brings the Gradle the image pins.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - run: bash plugins/test.sh

  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The three loader mods (Minecraft 1.20.1 / 1.20.4, Java-17 lines) compile
      # through their vendored Gradle wrappers, which fetch their own Gradle. Until
      # this job nothing ever built them: no install path touches them, and their
      # gradlew scripts were committed without the exec bit, so the README's
      # one-liners failed on a fresh clone.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - run: bash plugins/test-mods.sh
